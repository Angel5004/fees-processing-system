{% extends './base.html' %}
{% load crispy_forms_tags %}

{% block content %}
    <h1>Add Classroom</h1>
    <div class = "container">
        <form method = "POST">
            {% csrf_token %} 
            {{form|crispy}}
            <input type = "submit" class = "btn btn-primary">
        </form>
        {% if message %}
            <p>{{ message }}</p>
        {% endif %}

        <table class="table table-striped">
            <thead>
                <tr>
                <th scope="col">class_number</th>
                </tr>
            </thead>
            <tbody>
                {% for classroom in classrooms %}
                <tr>
                    <td scope="row">{{ classroom.class_number }}</td>
                    <td>
                        <a href = "{% url 'edit_classroom_page' classroom.id %}">Edit</a>
                        <a href = "{% url 'delete_classroom_page' classroom.id %}"
                        onclick = "return confirm('Are you sure you want to delete?')">
                        Delete
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table> 
        <a href = "{% url 'index_page'%}">Home</a>
   
    </div>
    
{% endblock content %}
